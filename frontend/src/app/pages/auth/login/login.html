<div class="login-page">
  <div class="login-box">
    <div class="login-logo">D</div>
    <h1 class="login-title">{{ 'auth.welcome' | t }}</h1>
    <p class="login-sub">{{ 'auth.subtitle' | t }}</p>

    <div class="toggle-tabs">
      <div class="toggle-tab" [class.active]="mode() === 'login'" (click)="setMode('login')">
        {{ 'auth.signIn' | t }}
      </div>
      <div class="toggle-tab" [class.active]="mode() === 'register'" (click)="setMode('register')">
        {{ 'auth.register' | t }}
      </div>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (mode() === 'register') {
        <div>
          <label for="name">{{ 'auth.fullName' | t }}</label>
          <input id="name" type="text" formControlName="name" placeholder="Jordan Smith" />
        </div>
      }
      <div>
        <label for="email">{{ 'auth.email' | t }}</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
      </div>
      <div>
        <label for="password">{{ 'auth.password' | t }}</label>
        <div class="password-wrap">
          <input id="password" [type]="showPass() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" />
          <button class="eye-btn" type="button" (click)="showPass.set(!showPass())">
            <i class="ti" [class.ti-eye]="!showPass()" [class.ti-eye-off]="showPass()"></i>
          </button>
        </div>
      </div>

      <p class="login-error" [class.show]="error()">{{ error() | t }}</p>
      <p class="login-success" [class.show]="success()">{{ success() | t }}</p>

      <button class="btn-login" type="submit">
        {{ (mode() === 'login' ? 'auth.signIn' : 'auth.createAccount') | t }}
      </button>
    </form>

    <p class="login-divider">Dev Dashboard v1.0</p>
  </div>
</div>
