<div class="topbar">
  <div class="greeting">
    <h1>{{ 'nav.tasks' | t }}</h1>
    <p>{{ 'task.subtitle' | t }}</p>
  </div>
  <div class="topbar-actions">
    @if (roleSvc.isTeamLead()) {
      <button class="btn-new" type="button" (click)="openNew()">
        <i class="ti ti-plus"></i> {{ 'task.new' | t }}
      </button>
    }
  </div>
</div>

<div class="card">
  <app-task-list
    [tasks]="tasks()"
    [loading]="loading()"
    [error]="error()"
    (changed)="load()"
  />
</div>
