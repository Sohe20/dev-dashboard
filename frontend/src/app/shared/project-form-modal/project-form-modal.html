<div class="modal-overlay open" (click)="closed.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ project() ? 'Edit Project' : 'New Project' }}</h3>
      <button class="modal-close" type="button" (click)="closed.emit()">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="modal-body">
        <div class="form-group">
          <label for="pname">Project Name</label>
          <input id="pname" type="text" formControlName="name" placeholder="e.g. Design System" />
        </div>
        <div class="form-group">
          <label for="pdesc">Description</label>
          <input id="pdesc" type="text" formControlName="description" placeholder="Short description..." />
        </div>
        <div class="form-group">
          <label for="pprogress">Progress (%)</label>
          <input id="pprogress" type="number" formControlName="progress" min="0" max="100" />
        </div>
        <div class="form-group">
          <label for="pbudget">Budget ($)</label>
          <input id="pbudget" type="number" formControlName="budget" min="0" />
        </div>
        <div class="form-group">
          <label for="pstatus">Status</label>
          <select id="pstatus" formControlName="status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
            <option value="paused">Paused</option>
          </select>
        </div>
        @if (error()) {
          <p class="form-error">{{ error() }}</p>
        }
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" type="button" (click)="closed.emit()">Cancel</button>
        <button class="btn-submit" type="submit" [disabled]="saving()">
          {{ project() ? 'Update Project' : 'Create Project' }}
        </button>
      </div>
    </form>
  </div>
</div>
