<div class="modal-overlay open" (click)="closed.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ (task() ? 'task.edit' : 'task.new') | t }}</h3>
      <button class="modal-close" type="button" (click)="closed.emit()">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="modal-body">
        <div class="form-group">
          <label for="ttitle">{{ 'task.title' | t }}</label>
          <input id="ttitle" type="text" formControlName="title" [placeholder]="'task.titlePh' | t" />
        </div>
        <div class="form-group">
          <label for="tdesc">{{ 'common.description' | t }}</label>
          <input id="tdesc" type="text" formControlName="description" [placeholder]="'common.descriptionPh' | t" />
        </div>
        <div class="form-group">
          <label for="tproject">{{ 'task.project' | t }}</label>
          <select id="tproject" formControlName="projectId">
            <option [ngValue]="null">{{ 'task.selectProject' | t }}</option>
            @for (p of projects(); track p.id) {
              <option [ngValue]="p.id">{{ p.name }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label for="tstatus">	{{ 'common.status' | t }}</label>
          <select id="tstatus" formControlName="status">
            <option value="todo">{{ 'status.todo' | t }}</option>
            <option value="inprogress">{{ 'status.inprogress' | t }}</option>
            <option value="done">{{ 'status.done' | t }}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tassignee">{{ 'task.assignTo' | t }}</label>
          <select id="tassignee" formControlName="assigneeId">
            <option [ngValue]="null">{{ 'task.selectMember' | t }}</option>
            @for (u of users(); track u.id) {
              <option [ngValue]="u.id">{{ u.name }}</option>
            }
          </select>
        </div>
        @if (error()) {
          <p class="form-error">{{ error() | t }}</p>
        }
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" type="button" (click)="closed.emit()">{{ 'common.cancel' | t }}</button>
        <button class="btn-submit" type="submit" [disabled]="saving()">
          {{ (task() ? 'task.update' : 'task.create') | t }}
        </button>
      </div>
    </form>
  </div>
</div>
