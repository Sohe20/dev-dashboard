<div class="modal-overlay open" (click)="closed.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ 'team.new' | t }}</h3>
      <button class="modal-close" type="button" (click)="closed.emit()">
        <i class="ti ti-x"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="modal-body">
        <div class="form-group">
          <label for="muser">{{ 'team.selectUser' | t }}</label>
          <select id="muser" formControlName="userId">
            <option [ngValue]="null">{{ 'team.selectUserOpt' | t }}</option>
            @for (u of users(); track u.id) {
              <option [ngValue]="u.id">{{ u.name }} ({{ u.email }})</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label for="mrole">{{ 'team.role' | t }}</label>
          <input id="mrole" type="text" formControlName="role" [placeholder]="'team.rolePh' | t" />
        </div>
        @if (error()) {
          <p class="form-error">{{ error() |t}}</p>
        }
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" type="button" (click)="closed.emit()">{{ 'common.cancel' | t }}</button>
        <button class="btn-submit" type="submit" [disabled]="saving()">{{ 'team.add' | t }}</button>
      </div>
    </form>
  </div>
</div>
