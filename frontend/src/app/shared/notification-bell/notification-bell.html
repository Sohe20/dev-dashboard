<button
  #bellBtn
  class="nav-item bell"
  type="button"
  [title]="'nav.notifications' | t"
  (click)="toggle()"
>
  <i class="ti ti-bell"></i>
  @if (unread() > 0) {
    <span class="badge">{{ unread() > 9 ? '9+' : unread() }}</span>
  }
</button>

@if (open()) {
  <div class="backdrop" (click)="open.set(false)"></div>
  <div
    class="panel"
    [style.bottom.px]="panelPos().bottom"
    [style.inset-inline-start.px]="panelPos().start"
  >
    <div class="panel-head">
      <span>{{ 'nav.notifications' | t }}</span>
      @if (items().length) {
        <div class="head-actions">
          <button type="button" class="link-btn" [disabled]="unread() === 0" (click)="readAll()">
            {{ 'notif.markAll' | t }}
          </button>
          <button type="button" class="link-btn danger" (click)="clearAll()">
            {{ 'notif.clearAll' | t }}
          </button>
        </div>
      }
    </div>

    <div class="panel-body">
      @if (!items().length) {
        <div class="empty">{{ 'notif.none' | t }}</div>
      }
      @for (n of items(); track n.id) {
        <div class="item" [class.unread]="!n.isRead" (click)="openItem(n)">
          <i [class]="'ti ' + icons[n.type].icon" [style.color]="icons[n.type].color"></i>
          <div class="text">
            <div class="msg">{{ text(n) }}</div>
            @if (note(n)) {
              <div class="note">{{ 'notif.note' | t: { note: note(n) } }}</div>
            }
            <div class="time">{{ n.createdAt | date: 'MMM d, HH:mm' }}</div>
          </div>
        </div>
      }
    </div>
  </div>
}
