<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Dashboard — Reset Password</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="auth.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
  </head>
  <body>
    <div class="login-page">
      <div class="login-box">
        <div class="login-logo">D</div>
        <h1 class="login-title">Reset Password</h1>
        <p class="login-sub">Enter your email and new password</p>
        <div class="login-form">
          <div>
            <label>Email</label>
            <input type="email" id="resetEmail" placeholder="you@example.com" />
          </div>
          <div class="password-wrap">
            <input type="password" id="resetNewPass" placeholder="••••••••" />
            <button
              class="eye-btn"
              type="button"
              onclick="togglePass('resetNewPass', this)"
            >
              <i class="ti ti-eye"></i>
            </button>
          </div>

          <div class="password-wrap">
            <input
              type="password"
              id="resetConfirmPass"
              placeholder="••••••••"
            />
            <button
              class="eye-btn"
              type="button"
              onclick="togglePass('resetConfirmPass', this)"
            >
              <i class="ti ti-eye"></i>
            </button>
          </div>
          <p class="login-error" id="resetError"></p>
          <p class="login-success" id="resetSuccess"></p>
          <button class="btn-login" onclick="resetPassword()">
            Reset Password
          </button>
          <div style="text-align: center; margin-top: 8px">
            <a
              href="login.html"
              style="font-size: 13px; color: #a08cff; text-decoration: none"
            >
              <i class="ti ti-arrow-left"></i> Back to Login
            </a>
          </div>
        </div>
        <p class="login-divider">Dev Dashboard v1.0</p>
      </div>
    </div>
    <script src="forgot-password.js"></script>
  </body>
</html>
